# docker compose up -d --build     → http://localhost:3000   (the admin is at /admin)
# docker compose --profile https up -d --build   → HTTPS for SITE_DOMAIN through Caddy
#
# 前置两步（干净克隆照抄下面一条命令会失败，原因见 docs/deploy.md「用 Docker（推荐）」）：
#   1. `node scripts/init-env.ts` 写出 .env（或按 .env.example 手写一份）；
#   2. 用 Node 的 dotenv 解析器把 .env 归一化一次 —— Compose 对「空值 + 行尾注释」的处理与 Node 不同，
#      所以 CI 在 `docker compose up` 之前一定会做：node:util 的 parseEnv 读入整个 .env，再按 "K":"V"
#      逐行重写。SITE_URL 由部署者显式给，不能抄 CI 的 http://web:3000（那只是它一次性栈里的服务名）：
#      生产闸门只拒 localhost/127.x/::1，写成别的非 localhost 值不会拒启，只会把错地址静默写进
#      canonical/OG/RSS/sitemap/security.txt。CI 的那一步见 .github/workflows/check.yml 的 "Configure a throwaway site"，
#      部署侧照 docs/deploy.md 的 ② 做（那里用 `export SITE_URL=…` 显式传入）。
#   POSTGRES_PASSWORD 没有兜底值：.env 里没有它，compose 在解析阶段就报错。
name: aihot

x-app: &app
  build: .
  image: aihot-app
  env_file: .env
  restart: unless-stopped
  environment: &app-env
    NODE_ENV: production
    # The api refuses to boot in production on a missing or localhost SITE_URL, because that address is
    # what lands in canonical tags, OpenGraph URLs, RSS <link>, sitemap <loc> and the MCP host lock.
    # Compose fails here with this message instead — a container that starts and publishes localhost
    # URLs everywhere is a worse failure than one that does not start.
    SITE_URL: ${SITE_URL:?SITE_URL must be the public address readers use, e.g. https://example.com}
    # 口令没有兜底：`.env` 里缺 POSTGRES_PASSWORD 就在这里失败，而不是拿一个弱口令把库起起来。
    # docs/deploy.md 与 .env.example 都要求它必填（`openssl rand -hex 32` 生成）。
    DATABASE_URL: postgres://aihot:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/aihot
    AIHOT_DATA_DIR: /data
    API_BASE_URL: http://api:3001
    LOCAL_ROUTER_URL: http://web:3000
  volumes:
    - data:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aihot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: aihot
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihot -d aihot"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Applies the database migrations and seeds the topics and demo sources, then exits.
  setup:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "node scripts/migrate.ts && node scripts/seed.ts"]

  api:
    <<: *app
    command: ["node", "apps/api/src/main.ts"]
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
      API_PORT: "3001"
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["node", "apps/worker/src/main.ts"]
    # On stop the worker lets a paid call in flight finish (STOP_TIMEOUT_MS, 255 s — one reasoning call
    # is allowed 240 s); Docker's default 10 s would kill it mid-call and leave "outcome unknown"
    # receipts that are paid for again.
    stop_grace_period: 285s
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    <<: *app
    command: ["node", "apps/web/server.ts"]
    environment:
      <<: *app-env
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - web

volumes:
  db: {}
  data: {}
  caddy: {}
