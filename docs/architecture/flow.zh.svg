<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2240" viewBox="0 0 1200 2240" role="img" aria-labelledby="title description" xml:lang="zh"><title id="title">GEOHOT · 从公开信源到读者</title><desc id="description">上半部分沿着一条材料展开采集、预筛、评分与公开条件的分支，下半部分说明已生成结果如何经统一读取层到达不同出口。橙色表示拦截、等待或控制条件，绿色表示公开结果。图中不固化信源数量、模型名称或评分门槛，避免把运行配置变成过时的架构说明。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 L 2 3.5 Z" fill="#4e585f"/></marker></defs><rect width="1200" height="2240" fill="#ffffff"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><path d="M 600 258 V 282.5 H 600 V 307" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 393 V 423 H 600 V 453" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 557 V 592 H 220 V 627" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="410" y="580" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="410" dy="0">BLOCK</tspan></text><path d="M 600 557 V 592 H 600 V 627" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="614" y="580" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="614" dy="0">PASS / UNKNOWN</tspan></text><path d="M 765 670 H 815" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="790" y="611" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="790" dy="0">调用约束</tspan></text><path d="M 600 713 V 752.5 H 600 V 792" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 878 V 908 H 600 V 938" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 1042 V 1077 H 220 V 1112" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="410" y="1065" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="410" dy="0">否</tspan></text><path d="M 600 1042 V 1072.5 H 600 V 1103" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="614" y="1060.5" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="614" dy="0">是</tspan></text><path d="M 600 1207 V 1242 H 220 V 1277" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="410" y="1230" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="410" dy="0">否 / 不评分</tspan></text><path d="M 600 1207 V 1242 H 600 V 1277" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="614" y="1230" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="614" dy="0">是</tspan></text><path d="M 765 1320 H 815" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="790" y="1261" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="790" dy="0">后续任务</tspan></text><path d="M 220 1363 V 1410 H 600 V 1457" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 1363 V 1410 H 600 V 1457" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 980 1363 V 1410 H 600 V 1457" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 1543 V 1582.5 H 600 V 1622" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 1708 V 1752.5 H 220 V 1797" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="220" y="1740.5" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">网页</tspan></text><path d="M 600 1708 V 1752.5 H 600 V 1797" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="600" y="1740.5" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">订阅与集成</tspan></text><path d="M 600 1708 V 1752.5 H 980 V 1797" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="980" y="1740.5" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">发现与分享</tspan></text><path d="M 220 1883 V 1930 H 600 V 1977" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 1883 V 1930 H 600 V 1977" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 980 1883 V 1930 H 600 V 1977" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="600" cy="146" r="7" fill="#252a2e"/><path d="M 600 153 V 172" stroke="#4e585f" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="435" y="172" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="208.5" text-anchor="middle" font-size="18.07" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">公开信源与合法外部投递</tspan><tspan x="600" dy="27">industry/ 定义信源、提示词与规则</tspan></text><rect x="435" y="307" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="343.5" text-anchor="middle" font-size="17.44" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">worker：采集、URL 判重、正文提取</tspan><tspan x="600" dy="27">pg-boss 在 PostgreSQL 中调度任务</tspan></text><path d="M 600 453 L 765 505 L 600 557 L 435 505 Z" fill="#ffffff" stroke="#68737b" stroke-width="1.7"/><text x="600" y="512" text-anchor="middle" font-size="20" font-weight="500" fill="#252a2e"><tspan x="600" dy="0">地理预筛结果？</tspan></text><rect x="55" y="627" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text x="220" y="663.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">BLOCK：保留拦截依据</tspan><tspan x="220" dy="27">停止后续分析，不进入公开池</tspan></text><rect x="435" y="627" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="663.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">PASS / UNKNOWN：继续分析</tspan><tspan x="600" dy="27">两次独立评分；并行提取结构</tspan></text><rect x="815" y="627" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text x="980" y="663.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">所有模型调用经过回执与预算</tspan><tspan x="980" dy="27">复用已完成结果；超预算等待</tspan></text><rect x="435" y="792" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="828.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">按评分与内容生成标题和摘要</tspan><tspan x="600" dy="27">分类、标签、实体写入分析结果</tspan></text><path d="M 600 938 L 765 990 L 600 1042 L 435 990 Z" fill="#ffffff" stroke="#68737b" stroke-width="1.7"/><text x="600" y="997" text-anchor="middle" font-size="20" font-weight="500" fill="#252a2e"><tspan x="600" dy="0">满足公开池条件？</tspan></text><rect x="55" y="1112" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text x="220" y="1148.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">缺少可用文案或不符合规则</tspan><tspan x="220" dy="27">保留后台状态，不公开</tspan></text><path d="M 600 1103 L 765 1155 L 600 1207 L 435 1155 Z" fill="#ffffff" stroke="#68737b" stroke-width="1.7"/><text x="600" y="1148.5" text-anchor="middle" font-size="19.62" font-weight="500" fill="#252a2e"><tspan x="600" dy="0">两次分数之和达到等级门槛？</tspan><tspan x="600" dy="27">且信源允许入选</tspan></text><rect x="55" y="1277" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text x="220" y="1313.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">未入选但符合公开条件</tspan><tspan x="220" dy="27">进入全部动态</tspan></text><rect x="435" y="1277" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="1313.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">入选后仍经过可见性门槛</tspan><tspan x="600" dy="27">写入发布状态与可见时间</tspan></text><rect x="815" y="1277" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="980" y="1313.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">后台任务归并事件、计算热度</tspan><tspan x="980" dy="27">组织事件综述与定期刊物</tspan></text><rect x="435" y="1457" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="1493.5" text-anchor="middle" font-size="17.65" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">PostgreSQL 保存已生成结果</tspan><tspan x="600" dy="27">条目、分析、事件、刊物、队列与回执</tspan></text><rect x="435" y="1622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="1658.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Fastify API → publication/</tspan><tspan x="600" dy="27">统一执行公开内容与可见性规则</tspan></text><rect x="55" y="1797" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="220" y="1833.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">React Router 服务端渲染</tspan><tspan x="220" dy="27">web 仅通过 HTTP 读取 API</tspan></text><rect x="435" y="1797" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="1833.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">RSS · API v1 · MCP</tspan><tspan x="600" dy="27">共享同一公开读取层</tspan></text><rect x="815" y="1797" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="980" y="1833.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">站点地图 · llms.txt · 分享图</tspan><tspan x="980" dy="27">沿用公开读取规则</tspan></text><rect x="435" y="1977" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text x="600" y="2013.5" text-anchor="middle" font-size="18.75" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">读者浏览已生成的内容，不触发模型</tspan><tspan x="600" dy="27">收藏与已读保存在当前浏览器</tspan></text><text x="600" y="45" text-anchor="middle" font-size="30" font-weight="600" fill="#252a2e"><tspan x="600" dy="0">GEOHOT · 从公开信源到读者</tspan></text><text x="600" y="82" text-anchor="middle" font-size="18" font-weight="400" fill="#59646c"><tspan x="600" dy="0">后台生成与前台读取分开；数据与任务共用 PostgreSQL。</tspan></text><rect x="177" y="103" width="26" height="21" rx="3" fill="#f4f5f6" stroke="#899198"/><text x="213" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="213" dy="0">处理步骤</tspan></text><path d="M 435 102 l 13 11 l -13 11 l -13 -11 Z" fill="white" stroke="#899198"/><text x="458" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="458" dy="0">条件判断</tspan></text><rect x="667" y="103" width="26" height="21" rx="3" fill="#edf6ee" stroke="#267349"/><text x="703" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="703" dy="0">可见结果</tspan></text><rect x="912" y="103" width="26" height="21" rx="3" fill="#fff5e9" stroke="#aa681f"/><text x="948" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="948" dy="0">约束 / 后备路径</tspan></text><text x="600" y="2173" text-anchor="middle" font-size="16" font-weight="400" fill="#626c74"><tspan x="600" dy="0">逻辑流程图，不是部署实例或完成进度图。实际门槛与发布条件以代码为准。</tspan></text><text x="600" y="2205" text-anchor="middle" font-size="15" font-weight="400" fill="#78838b"><tspan x="600" dy="0">文档示意图 · 2026 年 10 月 22 日 · SVG 文字与路径可编辑</tspan></text></g></svg>
