<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2240" viewBox="0 0 1200 2240" role="img" aria-labelledby="title description" xml:lang="en"><title id="title">GEOHOT · From public sources to readers</title><desc id="description">The upper half follows an item through collection, prefiltering, scoring and publication decisions. The lower half shows how stored results reach each public interface through a shared read layer. Amber marks blocking, waiting or control conditions; green marks public results. Source counts, model names and numeric thresholds remain in configuration rather than being frozen into the diagram.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 L 2 3.5 Z" fill="#4e585f"/></marker></defs><rect width="1200" height="2240" fill="#ffffff"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><path d="M 600 258 V 282.5 H 600 V 307" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 393 V 423 H 600 V 453" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 557 V 592 H 220 V 627" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="410" y="580" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="410" dy="0">BLOCK</tspan></text><path d="M 600 557 V 592 H 600 V 627" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="614" y="580" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="614" dy="0">PASS / UNKNOWN</tspan></text><path d="M 765 670 H 815" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="790" y="611" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="790" dy="0">Call controls</tspan></text><path d="M 600 713 V 752.5 H 600 V 792" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 878 V 908 H 600 V 938" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 1042 V 1077 H 220 V 1112" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="410" y="1065" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="410" dy="0">No</tspan></text><path d="M 600 1042 V 1072.5 H 600 V 1103" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="614" y="1060.5" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="614" dy="0">Yes</tspan></text><path d="M 600 1207 V 1242 H 220 V 1277" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="410" y="1230" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="410" dy="0">No / unscored</tspan></text><path d="M 600 1207 V 1242 H 600 V 1277" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="614" y="1230" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="614" dy="0">Yes</tspan></text><path d="M 765 1320 H 815" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="790" y="1261" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="790" dy="0">Follow-up jobs</tspan></text><path d="M 220 1363 V 1410 H 600 V 1457" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 1363 V 1410 H 600 V 1457" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 980 1363 V 1410 H 600 V 1457" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 1543 V 1582.5 H 600 V 1622" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 1708 V 1752.5 H 220 V 1797" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="220" y="1740.5" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">Web</tspan></text><path d="M 600 1708 V 1752.5 H 600 V 1797" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="600" y="1740.5" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Feeds and integrations</tspan></text><path d="M 600 1708 V 1752.5 H 980 V 1797" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="980" y="1740.5" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">Discovery and sharing</tspan></text><path d="M 220 1883 V 1930 H 600 V 1977" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 1883 V 1930 H 600 V 1977" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 980 1883 V 1930 H 600 V 1977" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="600" cy="146" r="7" fill="#252a2e"/><path d="M 600 153 V 172" stroke="#4e585f" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="435" y="172" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="208.5" text-anchor="middle" font-size="12.18" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Public sources and authorised ingestion</tspan><tspan x="600" dy="27">industry/ defines sources, prompts and rules</tspan></text><rect x="435" y="307" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="343.5" text-anchor="middle" font-size="12.76" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">worker: collect, deduplicate, extract text</tspan><tspan x="600" dy="27">pg-boss schedules jobs in PostgreSQL</tspan></text><path d="M 600 453 L 765 505 L 600 557 L 435 505 Z" fill="#ffffff" stroke="#68737b" stroke-width="1.7"/><text x="600" y="512" text-anchor="middle" font-size="16.87" font-weight="500" fill="#252a2e"><tspan x="600" dy="0">Geography prefilter result?</tspan></text><rect x="55" y="627" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text x="220" y="663.5" text-anchor="middle" font-size="13.74" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">BLOCK: retain the rejection reason</tspan><tspan x="220" dy="27">Stop analysis; exclude from public pool</tspan></text><rect x="435" y="627" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="663.5" text-anchor="middle" font-size="13.07" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">PASS / UNKNOWN: continue analysis</tspan><tspan x="600" dy="27">Two independent scores; extract structure</tspan></text><rect x="815" y="627" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text x="980" y="663.5" text-anchor="middle" font-size="13.74" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">Model calls use receipts and budgets</tspan><tspan x="980" dy="27">Reuse completed results; wait on budget</tspan></text><rect x="435" y="792" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="828.5" text-anchor="middle" font-size="13.39" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Write titles and summaries by score/type</tspan><tspan x="600" dy="27">Store categories, tags and entities</tspan></text><path d="M 600 938 L 765 990 L 600 1042 L 435 990 Z" fill="#ffffff" stroke="#68737b" stroke-width="1.7"/><text x="600" y="997" text-anchor="middle" font-size="15.7" font-weight="500" fill="#252a2e"><tspan x="600" dy="0">Eligible for the public pool?</tspan></text><rect x="55" y="1112" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text x="220" y="1148.5" text-anchor="middle" font-size="15.76" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">Missing usable copy or ineligible</tspan><tspan x="220" dy="27">Keep backend state; do not publish</tspan></text><path d="M 600 1103 L 765 1155 L 600 1207 L 435 1155 Z" fill="#ffffff" stroke="#68737b" stroke-width="1.7"/><text x="600" y="1148.5" text-anchor="middle" font-size="12.31" font-weight="500" fill="#252a2e"><tspan x="600" dy="0">Score sum reaches the tier threshold?</tspan><tspan x="600" dy="27">Source must also permit selection</tspan></text><rect x="55" y="1277" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text x="220" y="1313.5" text-anchor="middle" font-size="17" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">Eligible but not selected</tspan><tspan x="220" dy="27">Available in all updates</tspan></text><rect x="435" y="1277" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="1313.5" text-anchor="middle" font-size="13.39" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Selected items pass the release gate</tspan><tspan x="600" dy="27">Store publication state and release time</tspan></text><rect x="815" y="1277" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="980" y="1313.5" text-anchor="middle" font-size="13.07" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">Jobs group events and calculate heat</tspan><tspan x="980" dy="27">Prepare overviews and periodical editions</tspan></text><rect x="435" y="1457" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="1493.5" text-anchor="middle" font-size="10.93" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">PostgreSQL stores generated results</tspan><tspan x="600" dy="27">Items, analyses, events, editions, jobs, receipts</tspan></text><rect x="435" y="1622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="1658.5" text-anchor="middle" font-size="11.9" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Fastify API → publication/</tspan><tspan x="600" dy="27">Apply shared public-content and release rules</tspan></text><rect x="55" y="1797" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="220" y="1833.5" text-anchor="middle" font-size="17" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">React Router server rendering</tspan><tspan x="220" dy="27">web reads the API over HTTP</tspan></text><rect x="435" y="1797" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="1833.5" text-anchor="middle" font-size="14.48" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">RSS · API v1 · MCP</tspan><tspan x="600" dy="27">Share the same publication read layer</tspan></text><rect x="815" y="1797" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="980" y="1833.5" text-anchor="middle" font-size="16.23" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">Sitemap · llms.txt · share images</tspan><tspan x="980" dy="27">Use the public reading rules</tspan></text><rect x="435" y="1977" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text x="600" y="2013.5" text-anchor="middle" font-size="11.4" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Readers view stored content without model calls</tspan><tspan x="600" dy="27">Bookmarks and read state stay in the browser</tspan></text><text x="600" y="45" text-anchor="middle" font-size="30" font-weight="600" fill="#252a2e"><tspan x="600" dy="0">GEOHOT · From public sources to readers</tspan></text><text x="600" y="82" text-anchor="middle" font-size="18" font-weight="400" fill="#59646c"><tspan x="600" dy="0">Background generation and public reading are separate; data and jobs share PostgreSQL.</tspan></text><rect x="177" y="103" width="26" height="21" rx="3" fill="#f4f5f6" stroke="#899198"/><text x="213" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="213" dy="0">Process</tspan></text><path d="M 435 102 l 13 11 l -13 11 l -13 -11 Z" fill="white" stroke="#899198"/><text x="458" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="458" dy="0">Decision</tspan></text><rect x="667" y="103" width="26" height="21" rx="3" fill="#edf6ee" stroke="#267349"/><text x="703" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="703" dy="0">Visible result</tspan></text><rect x="912" y="103" width="26" height="21" rx="3" fill="#fff5e9" stroke="#aa681f"/><text x="948" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="948" dy="0">Guard / fallback</tspan></text><text x="600" y="2173" text-anchor="middle" font-size="16" font-weight="400" fill="#626c74"><tspan x="600" dy="0">Logical flow, not a deployment inventory or progress chart. Code defines current thresholds and publication conditions.</tspan></text><text x="600" y="2205" text-anchor="middle" font-size="15" font-weight="400" fill="#78838b"><tspan x="600" dy="0">Documentation illustration · 22 October 2026 · SVG, editable text and paths</tspan></text></g></svg>
