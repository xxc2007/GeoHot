# search-mcp.conf — 服务器端 search MCP stdio 子进程环境变量（预留，默认关闭）
#
# 2026-11-16 全服务器自治改造：search MCP 部署骨架。当前 search-providers.ts 直接 HTTP
# 调用 ddg-lite，尚未 spawn MCP 子进程。本 drop-in 为未来迁移预留，默认 ENABLED=0。
#
# 灰度：GEOHOT_SEARCH_MCP_ENABLED=0（不启用）。信源侧确认合规 provider 清单、MCP 二进制
# 部署到 /opt/geohot/search-mcp/ 后，改 1 并 restart worker。回滚改回 0。
#
# 密钥：keyed 引擎的 API key 写在 /etc/geohot/search-mcp.env（chmod 600 geohot:geohot），
# 不入库、不提交。默认仅 ddg-lite（keyless）；Bing 因 ToS 未确认不默认启用。

[Service]
Environment="GEOHOT_SEARCH_MCP_ENABLED=0"
Environment="GEOHOT_SEARCH_MCP_LAUNCHER=/opt/geohot/app/deploy/geohot/bin/search-mcp-launch.sh"
Environment="GEOHOT_SEARCH_MCP_BIN=/opt/geohot/search-mcp/bin/mcp.js"
