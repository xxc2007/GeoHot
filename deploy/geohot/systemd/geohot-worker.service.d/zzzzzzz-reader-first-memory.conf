# 读者优先：把 worker 的内存钉死在硬上限里。
#
# 2026-11-04 19:0x 实测（891MB / 2 vCPU 的机器）：
#   - worker 不受内存约束时，首页 /geohot/ 在 15.0–17.3 秒后回 503（SSR 排队 + 8s/15s 语句超时）；
#   - 停掉 worker，首页立刻回到 0.30–0.52 秒；
#   - 只加本文件的 MemoryHigh/MemoryMax（不降并发），首页回到 0.28–0.84 秒，worker 仍在跑。
# 结论：这台机器的瓶颈是内存换页，不是 CPU。所以先给 worker 划线，再谈吞吐。
#
# CPUWeight/IOWeight/Nice 已经写在 zz-reader-safety-20261026.conf 里，这里不重复
# （重复写会因 drop-in 排序互相覆盖，反而看不出谁在生效）。
# 文件名排序在 zzzzzz 之后，保证这几条不会被前面的 drop-in 覆盖。

[Service]
MemoryHigh=120M
MemoryMax=200M
MemorySwapMax=256M