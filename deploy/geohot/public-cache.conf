# Include in nginx http {}. Only GET/HEAD routes that never read identity may share responses.
# Origin Cache-Control, Set-Cookie, Vary and absolute X-Accel-Expires remain authoritative.
#
# ⚠ 这份文件**不会随 deploy.sh 自动上线**。deploy.sh 只同步 `deploy/geohot/nginx/*.conf` 到
#   /etc/nginx/snippets 或 conf.d，而且只覆盖「目标文件已存在 / 已被 include」的那些；本文件在
#   deploy/geohot/ 根下，是手工安装的那一层（见 deploy/geohot/nginx/README.md）。
#   改完这里的 map，线上不会自己变。上线（需批准，属生产变更）：
#     ssh <reader-host> "grep -rln geohot_cache_route /etc/nginx"     # 先确认真实文件名，别假设
#     sudo cp -a <那个文件> /root/nginx-cache-route.bak-$(date +%s)
#     sudo install -m 644 public-cache.conf <那个文件>
#     sudo nginx -t && sudo systemctl reload nginx
#     curl -sI -H 'Host: xxc2007.me' http://127.0.0.1/geohot/en | grep -i x-geohot-public-cache   # 不再是 BYPASS
#   回滚：install 回备份文件 → nginx -t → reload。nginx -t 不过就别 reload。
proxy_cache_path /var/cache/nginx/geohot_public levels=1:2 keys_zone=geohot_public:4m
                 max_size=128m inactive=30m use_temp_path=off;
map $request_method $geohot_cache_method {
    default 0;
    GET 1;
    HEAD 1;
}
map $uri $geohot_cache_route {
    default 0;
    ~^/geohot/_\.data$ 1;
    ~^/geohot/(?:$|(?:all|hot|daily|weekly|monthly|topics|about|agent|changelog)(?:\.data)?$) 1;
    ~^/geohot/(?:items|stories|topics|daily|weekly|monthly)/[A-Za-z0-9_-]+(?:\.data)?$ 1;
    # 2026-11-27 现场：/geohot/en 整棵树不在这张表里，于是它既不进公共缓存，也拿不到
    # proxy_cache_use_stale —— 库一忙，每一屏 /en 都是源站冷渲染并直接 503，而同刻中文屏靠
    # STALE 200 顶着。英文页与中文页是同一套读者组件、同一条 basename 前缀，没有身份读。
    #
    # map 是「首次匹配」，所以两个例外用 0 收在前面。两条的共同理由只有一个：**与中文侧保持对称**，
    # 不是因为它们「更贵」或「不能缓存」——
    #   /en/feedback           提交表单页（自己声明 s-maxage=300，feedback.tsx:19），中文 /geohot/feedback
    #                          今天不在白名单里，先跟中文一致。
    #   /en/items/:id/original 它和 /en/items/:id 的缓存头完全相同（item-original.tsx:6 直接 re-export
    #                          item.tsx 的 headers/meta，s-maxage=600 是同一个常量），中文 /geohot/items/:id/original
    #                          今天也不进缓存，同样先跟中文一致。要放开就两边一起放开。
    ~^/geohot/en/(?:feedback|items/[^/]+/original)(?:\.data)?$ 0;
    # 其余 /en 子树照中文页的规矩办：/geohot/en、/geohot/en/*、React Router 的 /geohot/en.data。
    ~^/geohot/en(?:$|/|\.data$) 1;
    ~^/geohot/api/site/(?:timeline|pool|calendar|meta|stats|changelog|topics)$ 1;
    ~^/geohot/(?:feed(?:/[^/]+)*\.xml|sitemap\.xml|llms\.txt|openapi-v1\.json)$ 1;
}
map "$geohot_cache_method:$geohot_cache_route:$http_authorization" $geohot_skip_cache {
    default 1;
    "1:1:" 0;
}
# Public readers do not read cookies; an admin or CDN cookie must not disable their cache.
# Admin, feedback, POST, Authorization, Set-Cookie and origin no-store remain excluded.
#
# 缓存多久不是这张表决定的：apps/web/server.ts:153-159 把路由声明的 s-maxage 写成 X-Accel-Expires，
# nginx 以它为准（首页 180 秒、topics 300 秒、item 600 秒）；public-cache-location.conf:14 的
# proxy_cache_valid 200 60s 只是没有这些头时的兜底。
