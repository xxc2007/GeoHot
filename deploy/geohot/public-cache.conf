# Include in nginx http {}. Only anonymous GET/HEAD reader routes may share responses.
# Origin Cache-Control, Set-Cookie, Vary and absolute X-Accel-Expires remain authoritative.
proxy_cache_path /var/cache/nginx/geohot_public levels=1:2 keys_zone=geohot_public:4m
                 max_size=128m inactive=30m use_temp_path=off;
map $request_method $geohot_cache_method {
    default 0;
    GET 1;
    HEAD 1;
}
map $uri $geohot_cache_route {
    default 0;
    ~^/geohot/(?:$|(?:all|hot|daily|weekly|monthly|topics|about|agent|changelog)(?:\.data)?$) 1;
    ~^/geohot/(?:items|stories|topics|daily|weekly|monthly)/[A-Za-z0-9_-]+(?:\.data)?$ 1;
    ~^/geohot/api/site/(?:timeline|pool|calendar|meta|stats|changelog|topics)$ 1;
    ~^/geohot/(?:feed(?:/[^/]+)*\.xml|sitemap\.xml|llms\.txt|openapi-v1\.json)$ 1;
}
map "$geohot_cache_method:$geohot_cache_route:$http_authorization:$http_cookie" $geohot_skip_cache {
    default 1;
    "1:1::" 0;
}
