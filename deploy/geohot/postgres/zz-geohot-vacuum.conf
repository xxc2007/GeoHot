# 主库只有一块慢盘，autovacuum 按默认 2ms cost_delay 就能把 I/O 压到 99%，读者面被拖到 5 秒。
# 让回收让路：更慢、更温和，读者优先。
#
# 2026-11-16 事故记录：这台机器上手工写过 autovacuum_vacuum_cost_delay = 200，PostgreSQL 17
# 的合法上限是 100ms，于是「重启数据库」这一步直接 FATAL: configuration file contains errors、
# pg_ctl: could not start server —— 平时不重启就看不出问题，真出事时数据库起不来。
# 所以这段配置从机器态搬进仓库，由部署同步，并有 tests/postgres-conf-range.test.ts 守范围。
autovacuum_vacuum_cost_delay = 50
autovacuum_vacuum_cost_limit = 100
