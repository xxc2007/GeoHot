# 2026-11-14：订阅源与报告页是重活——一条 /geohot/feed/all.xml 实测跑 66–168 秒，
# 它自己把 public read 的槽占满，别的读者就被判 busy 拿到 503。
# 这里给它们单独一层缓存（10 分钟 + 过期兜底），读者不再替全站等生成。
# 装法：把这段 location 插到 sites-enabled 里 `location ^~ /geohot {` 之前
# （正则 location 优先于前缀匹配），并在 /etc/nginx/snippets/ 放 geohot-feed-cache.conf。
location ~ ^/geohot/(feed[^/]*\.xml|reports?/.*|feed/.*)$ {
    include /etc/nginx/snippets/geohot-feed-cache.conf;
    include /etc/nginx/snippets/geohot-public-admission.conf;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
    proxy_connect_timeout 5s;
    proxy_send_timeout    90s;
    proxy_read_timeout    90s;
}
