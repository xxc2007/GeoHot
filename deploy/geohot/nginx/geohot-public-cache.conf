# GEOHOT 读者面的公共缓存片段（装到 /etc/nginx/snippets/geohot-public-cache.conf）。
#
# 2026-11-06：这段此前**只活在服务器上**，仓库里没有对应文件，于是「字体被策略挡住」那类修补
# （见 commit 06c1ea9 只改到了 deploy/geohot/public-cache-location.conf 的 Report-Only 头）
# 永远传不到真正下发强制策略的那一行。现在两者都在这里：Report-Only 与强制策略各一份，
# 值保持一致，只有 connect-src 的强制版放宽到 https:（Cloudflare 注入的信标需要）。
proxy_cache geohot_public;
proxy_cache_key "report-workflow-v1:$scheme$host$request_uri";
proxy_cache_bypass $geohot_skip_cache;
proxy_no_cache $geohot_skip_cache;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_lock_age 10s;
proxy_cache_revalidate on;
# 2026-11-09 现场：主库只有一块慢盘，读库一卡，读者就拿到 5xx/504。宁可给一分钟前的这一页，
# 也不要给错误页——所以保留 error/timeout/5xx 时的旧内容，并在后台悄悄刷新。
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_valid 200 60s;
proxy_cache_methods GET HEAD;
add_header X-Geohot-Public-Cache $upstream_cache_status always;

# Security headers lost to the add_header inheritance rule (this snippet's own add_header stops
# the server-level set from reaching /geohot/): restated here so both cache locations carry them.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# font-src：站点图标字体是 data: 内联（next/font 的产物），没有这一项会回落到 default-src 'self'，
# 浏览器控制台每条都是 "Loading the font 'data:font/woff2;base64,…' violates … default-src 'self'"。
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.autonavi.com; font-src 'self' data:; connect-src 'self' https://*.autonavi.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

# CSP enforcement + HSTS uplift (2026-11-03, origin nginx layer as the Cloudflare-panel fallback).
# Forced policy mirrors the Report-Only policy value, with one addition: script-src also allows the
# Cloudflare edge-injected insights beacon (https://static.cloudflareinsights.com).
# HSTS: browser takes the largest max-age when multiple Strict-Transport-Security headers are
# present, so 31536000 wins over the CF-edge 86400 and the server-level 15552000.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.autonavi.com; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
add_header Strict-Transport-Security "max-age=31536000" always;