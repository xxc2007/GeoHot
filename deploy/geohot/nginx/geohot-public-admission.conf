# 读者面与后台共用的入口限制（被 /etc/nginx/sites-enabled/* 里的 location include）。
# 键 $geohot_reader_key 由 conf.d/28-geohot-public-admission.conf 的三个 map 决定：
#   真实读者 → 访客地址（各自 2r/s，burst 12）
#   回环 / 后台与接口路径 → 空键（不进桶：前者是部署验收与预热器，后者自己有 api 侧预算）
limit_conn geohot_dynamic_conns 6;
limit_conn_status 429;
limit_req zone=geohot_reader_rate burst=12 nodelay;
