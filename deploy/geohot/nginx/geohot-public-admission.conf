# 读者面与后台共用的入口限制（被 /etc/nginx/sites-enabled/* 里的 location include）。
# 键 $geohot_reader_key 由 conf.d/28-geohot-public-admission.conf 的三个 map 决定：
#   真实读者 → 访客地址（各自 10r/s，burst 30）
#   回环 / 后台与接口路径 / 读者数据接口 → 空键（不进桶：验收与预热器、api 侧自有限额、JSON 便宜）
# 2026-11-28：burst 12 对「列表一屏 prefetch + 移动端重试」太紧，正常浏览会撞 429；并发连接同样放到 16。
limit_conn geohot_dynamic_conns 16;
limit_conn_status 429;
limit_req zone=geohot_reader_rate burst=30 nodelay;
