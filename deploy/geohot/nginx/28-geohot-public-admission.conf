# http {} scope. Bound aggregate SSR fan-out independently of user-agent claims.
map "$request_method:$uri" $geohot_dynamic_slot {
    default "";
    ~^(GET|HEAD):/geohot/(admin|assets|api/admin|api/mcp|api/img-proxy)(/|$) "";
    ~^(GET|HEAD):/geohot/.*\.(js|css|woff2?|png|jpe?g|webp|svg|ico|mp4|txt|xml)$ "";
    ~^(GET|HEAD):/geohot(?:/|$) "geohot-reader";
}
# 2026-11-14：limit_conn 原来按 slot 计数，回环也被算成一个访客，部署验收与预热器
# 会被自己的连接打满（error.log: limiting connections ... client: 127.0.0.1）。改用与 limit_req
# 同一把键（回环为空键、不计数），真实读者仍各自计数。
limit_conn_zone $geohot_reader_key zone=geohot_dynamic_conns:1m;
# A visitor's browsing must not share the request bucket of every other visitor/crawler.
# remote_addr is restored only from explicitly trusted Cloudflare proxy networks.
# 2026-11-05 21:3x：本机回环（部署验收一口气取 16 个页面）也算同一个访客，
# 2r/s 的桶被它自己打满，验收就报 `/ -> 503`。回环不进限速桶：它不是读者，
# 也不会掩盖真实读者的拥挤（真实读者仍按 CF-Connecting-IP 各自计数）。
geo $geohot_reader_exempt {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
}
map "$geohot_dynamic_slot:$geohot_reader_exempt" $geohot_reader_key {
    "" "";
    ~:1$ "";
    default $binary_remote_addr;
}
limit_req_zone $geohot_reader_key zone=geohot_reader_rate:1m rate=2r/s;
