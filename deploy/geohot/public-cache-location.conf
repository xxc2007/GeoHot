# Include only in GEOHOT's main proxy location; leave MCP/OG/admin transports separate.
proxy_cache geohot_public;
proxy_cache_key "report-workflow-v1:$scheme$host$request_uri";
proxy_cache_bypass $geohot_skip_cache;
proxy_no_cache $geohot_skip_cache;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_lock_age 10s;
proxy_cache_revalidate on;
# Do not serve expired editorial content, including on errors or while updating.
proxy_cache_use_stale off;
proxy_cache_background_update off;
proxy_cache_valid 200 60s;
proxy_cache_methods GET HEAD;
add_header X-Geohot-Public-Cache $upstream_cache_status always;

# Security headers lost to the add_header inheritance rule (this snippet's own add_header stops
# the server-level set from reaching /geohot/): restated here so both cache locations carry them.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.autonavi.com; connect-src 'self' https://*.autonavi.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
