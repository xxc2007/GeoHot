# Include only in GEOHOT's main proxy location; leave MCP/OG/admin transports separate.
proxy_cache geohot_public;
proxy_cache_key "report-workflow-v1:$scheme$host$request_uri";
proxy_cache_bypass $geohot_skip_cache;
proxy_no_cache $geohot_skip_cache;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_lock_age 10s;
proxy_cache_revalidate on;
# 2026-11-09 现场：主库只有一块慢盘，读库一卡，读者就拿到 5xx/504。宁可给一分钟前的这一页，
# 也不要给错误页——所以保留 error/timeout/5xx 时的旧内容，并在后台悄悄刷新。
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_valid 200 60s;
proxy_cache_methods GET HEAD;
add_header X-Geohot-Public-Cache $upstream_cache_status always;

# Security headers lost to the add_header inheritance rule (this snippet's own add_header stops
# the server-level set from reaching /geohot/): restated here so both cache locations carry them.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.autonavi.com; font-src 'self' data:; connect-src 'self' https://*.autonavi.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
