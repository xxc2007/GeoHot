# 版本 tag 与 Release 实时同步：changelog.json 每次随 main 更新（新条目/新重大更新），
# 本工作流自动按发布顺序编号补齐缺失的 v* 附注 tag，并为最新版本建/刷新 GitHub Release
# ——不再依赖人工在部署后记得打 tag（2026-11-02 发现 v3.0.1~v3.0.4 漏打的教训）。
# 逐条规则与算法见 scripts/list-release-versions.mjs（与线上 withVersionNumbers 同一算法）。
name: sync-version-tags
on:
  push:
    branches:
      - main
    paths:
      - industry/changelog.json
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 固定 SHA（与 check.yml 的 v7.0.1 同一个 commit）：这个 job 有 contents: write 且要 push tag，
      # 浮动 tag 等于把写权限交给上游未来的任意提交。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # 2026-11-06 现场：annotated tag 需要 committer 身份，runner 上默认没有，
      # 于是 `git tag -a` 直接 `fatal: empty ident name (for <runner@…>) not allowed`
      # —— 自 2026-11-05 起每次 main 带 changelog 的合并都红在这里（tag 没打、Release 没建）。
      - name: Give git an identity to sign tags with
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag new changelog versions
        run: |
          node scripts/list-release-versions.mjs > /tmp/plan.txt
          while IFS="$(printf '\t')" read -r tag datetime title; do
            if git tag -l "$tag" | grep -q .; then
              continue
            fi
            commit=$(git rev-list -1 --before="$datetime" "${GITHUB_SHA}")
            if [ -z "$commit" ]; then
              commit="$GITHUB_SHA"
            fi
            git tag -a "$tag" "$commit" -m "$tag ${title}"
            echo "tagged $tag -> ${commit:0:8}"
          done < /tmp/plan.txt
          if ! git push origin --tags; then
            echo "tag push rejected; fetching and retrying once"
            git fetch --tags --force origin
            git push origin --tags
          fi
      - name: Release the newest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -1 /tmp/plan.txt | while IFS="$(printf '\t')" read -r tag datetime title; do
            if gh release view "$tag" --repo xxc2007/GeoHot > /dev/null 2>&1; then
              echo "release $tag already exists"
              exit 0
            fi
            gh release create "$tag" --repo xxc2007/GeoHot --title "$tag ${title}" --notes "明细见站内更新日志 https://xxc2007.me/geohot/changelog"
          done
